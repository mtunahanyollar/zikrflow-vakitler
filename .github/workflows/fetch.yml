name: Namaz vakitlerini güncelle

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: fetch-vakitler
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_vakitler.py
      - name: Başarısızlıkları issue olarak aç
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          failures=$(python -c "import json; print(len(json.load(open('fetch_report.json'))['failed']))")
          if [ "$failures" -gt 5 ]; then
            gh issue create --title "Namaz vakitleri çekim hatası" --body "$failures ilçe çekilemedi. fetch_report.json dosyasına bakın."
          fi
      - name: Değişiklikleri kaydet
        if: success()
        run: |
          if [ -n "$(git status --porcelain vakitler fetch_report.json)" ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add vakitler fetch_report.json
            git commit -m "vakitler: $(date -u +%F)"
            # Çekim ~45 dk sürer; bu sırada depoya başka commit gelmiş olabilir.
            git pull --rebase origin main
            git push
          fi
